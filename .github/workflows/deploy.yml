name: Deploy Compass

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy local stack
        shell: powershell
        run: docker compose -f deploy/docker-compose.cloudflare.yml up -d --build
