<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="34" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="18" font-weight="bold">אינפוגרפיקה: Hip Openers (פתיחות ירך לשיפור טווח ותנועה)</text>
  <rect x="440" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="525" y="85" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">1. מכרעה סטטית</text>
  <text x="525" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">60 שניות לכל צד</text>
  <text x="525" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">גב זקוף ואגן שקוע בעדינות</text>
  <rect x="235" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="85" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="bold">2. פתיחת ירך חיצונית</text>
  <text x="320" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">60 שניות לכל צד</text>
  <text x="320" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">ללא דחיפה לכאב</text>
  <rect x="30" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="85" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">3. סיבובי ירך בעמידה</text>
  <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">30 שניות לכל צד</text>
  <text x="115" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">נשימה איטית לאורך התרגיל</text>
</svg>