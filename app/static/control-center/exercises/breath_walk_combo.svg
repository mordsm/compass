<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="34" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">אינפוגרפיקה: הליכה איטית + נשימת ויסות (4 צעדים שאיפה / 6 נשיפה)</text>
  <circle cx="480" cy="130" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="480" y="125" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">שאיפה: 4 צעדים</text>
  <text x="480" y="148" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">דרך האף ברוגע</text>
  <circle cx="320" cy="130" r="55" fill="#1e293b" stroke="#4ade80" stroke-width="3"/>
  <text x="320" y="125" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="16" font-weight="bold">נשיפה: 6 צעדים</text>
  <text x="320" y="148" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">נשיפה ארוכה ואיטית</text>
  <circle cx="160" cy="130" r="55" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <text x="160" y="125" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">12 דקות התאוששות</text>
  <text x="160" y="148" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">ללא טלפון וללא מאמץ</text>
</svg>