<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="34" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="18" font-weight="bold">אינפוגרפיקה: Single-Task Sprint (10 דקות מיקוד ללא הסחות)</text>
  <rect x="440" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="525" y="85" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">1. משימה אחת</text>
  <text x="525" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">הגדר תוצר מוחשי קטן</text>
  <text x="525" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">וסגור טאבים לא קשורים</text>
  <rect x="235" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="85" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="bold">2. טיימר 10 דקות</text>
  <text x="320" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">עלה רעיון אחר?</text>
  <text x="320" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">רשום בצד וחזור מיד</text>
  <rect x="30" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="85" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">3. השלם תוצר</text>
  <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">גם אם לא מושלם</text>
  <text x="115" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">דרג איכות פוקוס 1–5</text>
</svg>