<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="34" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">אינפוגרפיקה: 3 נקודות הכרת תודה (3 Gratitude Bullets)</text>
  <rect x="440" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="525" y="85" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">נקודה 1: מה קרה?</text>
  <text x="525" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">דבר קטן ומוחשי היום</text>
  <text x="525" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">(קפה, שיחה, אור בוקר)</text>
  <rect x="235" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="85" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">נקודה 2: למה זה חשוב?</text>
  <text x="320" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">משפט קצר אחד בלבד</text>
  <text x="320" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">בלי פילוסופיה ארוכה</text>
  <rect x="30" y="55" width="170" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="85" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="15" font-weight="bold">נקודה 3: איך זה הרגיש?</text>
  <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">שים לב לתחושה בגוף</text>
  <text x="115" y="135" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">ודרג חמימות/חיוביות 1–5</text>
</svg>