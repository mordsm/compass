openapi: 3.1.0
info:
  title: Compass Gateway
  version: 0.1.0
  description: Central GPT Actions API for daily planning and personal orchestration.
servers:
  - url: https://harrison-loan-labels-processing.trycloudflare.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    WriteResult:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
        resource_id:
          type: string
        already_existed:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        downstream:
          type: object
          properties: {}
          additionalProperties: true
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: health
      summary: Check whether Compass is running.
      security: []
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: compass
  /api/context/morning:
    post:
      operationId: getMorningContext
      summary: Load relevant context for the daily interview.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, date]
              properties:
                user_id:
                  type: string
                date:
                  type: string
                  format: date
                timezone:
                  type: string
                  default: Asia/Jerusalem
                include:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Morning context.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /api/context/morning/summary:
    post:
      operationId: getMorningContextSummary
      summary: Load a compact morning context summary for GPT display.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, date]
              properties:
                user_id:
                  type: string
                date:
                  type: string
                  format: date
                timezone:
                  type: string
                  default: Asia/Jerusalem
                include:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Compact morning context summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, user_id, date, timezone, systems, warnings]
                properties:
                  success:
                    type: boolean
                  user_id:
                    type: string
                  date:
                    type: string
                    format: date
                  timezone:
                    type: string
                  systems:
                    type: object
                    properties:
                      training:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          warning:
                            type: string
                      economic_manager:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          warning:
                            type: string
                      assessment:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          warning:
                            type: string
                      task_commander:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          warning:
                            type: string
                      administrative:
                        type: object
                        properties:
                          connected:
                            type: boolean
                          warning:
                            type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  open_task_count:
                    type: integer
                  recent_event_count:
                    type: integer
                  recent_daily_plan_count:
                    type: integer
                  suggested_focus:
                    type: array
                    items:
                      type: string
                  training_sessions_completed:
                    type: integer
                  training_next_focus:
                    type: string
                  economic_manager_summary:
                    type: object
                    properties: {}
                    additionalProperties: true
  /api/training/context:
    post:
      operationId: loadTrainingContext
      summary: Load current inner-training context through Compass.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  default: moshe
      responses:
        "200":
          description: Training context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  url:
                    type: string
                  warning:
                    type: string
                  result:
                    type: object
                    properties:
                      user_id:
                        type: string
                      program:
                        type: object
                        properties: {}
                        additionalProperties: true
                      goals:
                        type: array
                        items:
                          type: string
                      recent_sessions:
                        type: array
                        items:
                          type: object
                          properties: {}
                          additionalProperties: true
                      recurring_patterns:
                        type: array
                        items:
                          type: object
                          properties: {}
                          additionalProperties: true
                      active_practice:
                        type: object
                        properties: {}
                        additionalProperties: true
                      important_context:
                        type: array
                        items:
                          type: object
                          properties: {}
                          additionalProperties: true
                      safety_notes:
                        type: array
                        items:
                          type: string
  /api/training/sessions:
    post:
      operationId: saveTrainingSession
      summary: Save an inner-training session through Compass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, session_date, session_type]
              properties:
                user_id:
                  type: string
                  default: moshe
                session_date:
                  type: string
                  format: date
                program_week:
                  type: integer
                session_type:
                  type: string
                event_summary:
                  type: string
                trigger:
                  type: string
                automatic_interpretation:
                  type: string
                body_signals:
                  type: array
                  items:
                    type: string
                emotions:
                  type: array
                  items:
                    type: string
                action_urge:
                  type: string
                actual_response:
                  type: string
                working_hypothesis:
                  type: string
                chosen_value:
                  type: string
                alternative_response:
                  type: string
                practice_until_next_session:
                  type: string
                expected_obstacle:
                  type: string
                if_then_plan:
                  type: string
                key_insight:
                  type: string
                topics_to_revisit:
                  type: array
                  items:
                    type: string
                distress_before:
                  type: integer
                  minimum: 0
                  maximum: 10
                distress_after:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        "200":
          description: Session saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  url:
                    type: string
                  warning:
                    type: string
                  result:
                    type: object
                    properties:
                      success:
                        type: boolean
                      session_id:
                        type: string
                      message:
                        type: string
  /api/training/history/search:
    post:
      operationId: searchTrainingHistory
      summary: Search inner-training history through Compass.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, query]
              properties:
                user_id:
                  type: string
                  default: moshe
                query:
                  type: string
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                limit:
                  type: integer
                  default: 10
                  minimum: 1
                  maximum: 50
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  url:
                    type: string
                  warning:
                    type: string
                  result:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties: {}
                          additionalProperties: true
  /api/training/progress:
    post:
      operationId: getProgressReview
      summary: Get inner-training progress through Compass.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  default: moshe
                period:
                  type: string
                  default: last_30_days
      responses:
        "200":
          description: Progress review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  url:
                    type: string
                  warning:
                    type: string
                  result:
                    type: object
                    properties:
                      period:
                        type: string
                      sessions_completed:
                        type: integer
                      dominant_patterns:
                        type: array
                        items:
                          type: string
                      observed_improvements:
                        type: array
                        items:
                          type: string
                      persistent_difficulties:
                        type: array
                        items:
                          type: string
                      practices_that_helped:
                        type: array
                        items:
                          type: string
                      suggested_next_focus:
                        type: string
  /api/conversation/event:
    post:
      operationId: recordConversationEvent
      summary: Save an important event from the current conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, event_type, content]
              properties:
                idempotency_key:
                  type: string
                user_id:
                  type: string
                conversation_id:
                  type: string
                event_type:
                  type: string
                content:
                  type: string
                importance:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                structured_payload:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: Event saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
  /api/conversation/finalize:
    post:
      operationId: finalizeConversation
      summary: Save the final summary and close the conversation record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, summary]
              properties:
                idempotency_key:
                  type: string
                user_id:
                  type: string
                conversation_id:
                  type: string
                summary:
                  type: string
                decisions:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                tasks:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                open_questions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Conversation finalized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
  /api/daily-plan:
    post:
      operationId: saveDailyPlan
      summary: Save an approved daily plan and submit it to the rules backbone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, date]
              properties:
                idempotency_key:
                  type: string
                user_id:
                  type: string
                date:
                  type: string
                  format: date
                plan_id:
                  type: string
                status:
                  type: string
                  default: approved
                energy_level:
                  type: integer
                  minimum: 1
                  maximum: 5
                available_minutes:
                  type: integer
                  minimum: 0
                outcomes:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                scheduled_tasks:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                deferred_items:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                risks:
                  type: array
                  items:
                    type: object
                    properties: {}
                    additionalProperties: true
                notes:
                  type: string
      responses:
        "200":
          description: Daily plan saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
  /api/tasks/upsert:
    post:
      operationId: upsertTask
      summary: Create or update a task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, title]
              properties:
                idempotency_key:
                  type: string
                user_id:
                  type: string
                task_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [mentioned, proposed, approved, active, open, done, cancelled]
                  default: proposed
                due_date:
                  type: string
                  format: date
                priority:
                  type: string
                source:
                  type: string
                  default: gpt
                metadata:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: Task created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
  /api/rules/events:
    post:
      operationId: submitEventToRulesEngine
      summary: Submit a structured event to the existing rules engine backbone.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, event_type]
              properties:
                user_id:
                  type: string
                event_type:
                  type: string
                actor:
                  type: string
                context:
                  type: object
                  properties: {}
                  additionalProperties: true
                signals:
                  type: array
                  items:
                    type: string
                dry_run:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Rule evaluation result.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /api/agents/invoke:
    post:
      operationId: invokeAgent
      summary: Invoke a known specialist agent through Compass.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, task]
              properties:
                agent_id:
                  type: string
                  enum: [rules_engine, self_manage, assessment, mail_manager, economic_manager, task_commander, administrative, self_trainer]
                task:
                  type: string
                user_id:
                  type: string
                  default: moshe
                context:
                  type: object
                  properties: {}
                  additionalProperties: true
                expected_output:
                  type: string
                require_approval:
                  type: boolean
                  default: false
                risk_level:
                  type: string
                  default: medium
      responses:
        "200":
          description: Agent invocation result.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /api/approvals:
    post:
      operationId: createApprovalRequest
      summary: Create an approval request for a proposed action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, title, action_type]
              properties:
                idempotency_key:
                  type: string
                user_id:
                  type: string
                title:
                  type: string
                description:
                  type: string
                requested_by:
                  type: string
                  default: gpt
                action_type:
                  type: string
                risk_level:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                proposed_action:
                  type: object
                  properties: {}
                  additionalProperties: true
                rule_result:
                  type: object
                  properties: {}
                  additionalProperties: true
      responses:
        "200":
          description: Approval request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
    get:
      operationId: listApprovalRequests
      summary: List approval requests by user and status.
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Approval requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: {}
                  additionalProperties: true
  /api/approvals/{approval_id}:
    get:
      operationId: getApprovalRequest
      summary: Get one approval request.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval request.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /api/approvals/{approval_id}/approve:
    post:
      operationId: approveRequest
      summary: Mark an approval request as approved without executing it.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                decision_by:
                  type: string
                  default: user
                decision_notes:
                  type: string
      responses:
        "200":
          description: Approved request.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /api/approvals/{approval_id}/reject:
    post:
      operationId: rejectRequest
      summary: Mark an approval request as rejected.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                decision_by:
                  type: string
                  default: user
                decision_notes:
                  type: string
      responses:
        "200":
          description: Rejected request.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
